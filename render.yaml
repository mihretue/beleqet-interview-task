# Render Blueprint — API only (database hosted on Neon)
# 1. Create a Neon Postgres DB: https://console.neon.tech
# 2. Copy the connection string (use Direct connection for Prisma)
# 3. In Render → beleqet-api → Environment, set DATABASE_URL to your Neon URL
# 4. Add Redis from Upstash (REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_TLS=true)
# 5. Set FRONTEND_URL to your Vercel URL after frontend deploy

services:
  - type: web
    name: beleqet-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/jobs
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: OPENAI_API_KEY
        value: dummy_key_for_demo
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: FRONTEND_URL
        sync: false
