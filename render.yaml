# Render Blueprint — deploy from https://dashboard.render.com/blueprints
# After deploy, set FRONTEND_URL to your Vercel URL and REDIS_* from Upstash (free tier).

databases:
  - name: beleqet-db
    plan: free
    databaseName: beleqet_db
    user: beleqet_user

services:
  - type: web
    name: beleqet-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start:prod
    healthCheckPath: /api/v1/jobs
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: OPENAI_API_KEY
        value: dummy_key_for_demo
      - key: DATABASE_URL
        fromDatabase:
          name: beleqet-db
          property: connectionString
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: FRONTEND_URL
        sync: false
